<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

<body>
    <!-- Mensagens do site ("foi adicionado à mochila!", "Você comprou...") -->
    <div id="aviso"></div>

    <header>
        <header>
            <button class="btn botao-inicio" id="botao-inicio">Início</button>
            <button class="btn botao-sobre" id="botao-sobre">Sobre</button>
            <div class="menu-niveis">
                <button class="btn botao-niveis" id="botao-niveis">Níveis</button>
                <!-- O JavaScript coloca os níveis aqui dentro -->
                <ul id="lista-niveis"></ul>
            </div>
            <a href="carrinho.html">Carrinho (<span id="contador-carrinho">0</span>)</a>
        </header>
    </header>

    <main>
        <!-- O JavaScript coloca aqui o produto do endereço (ex.: produto.html?id=35) -->
        <section id="detalhe-produto"></section>
    </main>

    <footer>
       <!-- Deixar isso aqui pra esquerda do footer-->
       <div id="Copyright" class="Copyright">
        <p id="direitos">© Backstore 2026. Todos os direitos reservados</p>
    </div>
    
    <div class="desenvolvimento">
        <h1 id="tituloDesenvolvido">Desenvolvido Por</h1>
    <div id="redes" class="redes">
        <!-- Fazer com display "Row Column" pra ficar cada link um em baixo do outro-->
        <div id="LorePerfil" class="perfil">
            <a href="https://github.com/LorenzzoSantos">
            <img src="css/github_logo_icon_229278.webp" alt="Github do Lorenzzo" width="40px">
        </a>
        <p>Lorenzzo Santos</p>
    </div>
    <div id="ErlyPerfil" class="perfil">
        <a href="https://github.com/PedroErly67">
            <img src="css/github_logo_icon_229278.webp" alt="Github do Erly" width="40px">
        </a>
        <p>Pedro Corrêa</p>
    </div>
    <div id="LeoPerfil" class="perfil">
        <a href="https://github.com/leonardoconto-bot">
            <img src="css/github_logo_icon_229278.webp" alt="Github do Leonardo" width="40px">
        </a>
        <p>Leonardo Bevonesi</p>
    </div>
</div>
    </div>
    </footer>

    <script src="js/Script.js"></script>
