<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8", initial-scale="1.0">
    <title>Backstore</title>
    <link rel="stylesheet" href="css/Style.css">
    <!-- CSS provisório só pra testar o JavaScript. Apagar esta linha quando o Style.css estiver pronto -->
    <link rel="stylesheet" href="css/provisorio.css">
</head>
<body>
    <!-- Mensagens do site ("foi adicionado à mochila!", "Você comprou...") -->
    <div id="aviso"></div>

    <header>
        <button id="botao-inicio">Início</button>
        <button id="botao-sobre">Sobre</button>
        <button id="botao-niveis">Níveis</button>
        <!-- O JavaScript coloca os níveis aqui dentro -->
        <ul id="lista-niveis"></ul>
        <a href="carrinho.html">Carrinho (<span id="contador-carrinho">0</span>)</a>
    </header>

    <main>
        <!-- Aparece quando nenhum nível foi escolhido. O banner entra aqui no começo depois -->
        <section id="secao-destaques">
            <h2>Mais vendidos</h2>
            <div id="mais-vendidos"></div>

            <h2>Conheça os níveis</h2>
            <div id="conheca-niveis"></div>
        </section>

        <!-- Aparece quando um nível é escolhido -->
        <section id="secao-nivel" hidden>
            <h2 id="titulo-nivel"></h2>
            <div id="grade-produtos"></div>
        </section>
    </main>

    <footer>
        <!-- Deixar isso aqui pra esquerda do footer-->
        <div id="Copyright" class="Copyright">
            <p>© Backstore 2026. Todos os direitos reservados</p>
        </div>

        <!-- Deixar isso na direita do footer-->
        <div id="redes" class="redes">
            <!-- Fazer com display "Row Column" pra ficar cada link um em baixo do outro-->
            <a href="https://github.com/LorenzzoSantos">
                <img src="css/github_logo_icon_229278.webp" alt="Github do Lorenzzo" width="40px">
            </a>

            <a href="https://github.com/PedroErly67">
                <img src="css/github_logo_icon_229278.webp" alt="Github do Erly" width="40px">
            </a>

            <a href="https://github.com/leonardoconto-bot">
                <img src="css/github_logo_icon_229278.webp" alt="Github do Leonardo" width="40px">
            </a>
            <!-- Tentar deixar cada um do lado dos respectivos links (nomes ao lado direito dos ícones).-->
            <p>Lorenzzo Santos</p>
            <p>Pedro Corrêa</p>
            <p>Leonardo Bevonesi</p>
        </div>
    </footer>

    <script src="js/Script.js"></script>
</body>
</html>
